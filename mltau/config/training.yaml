training:
    debug_run: False
    # OneCycleLR's max_lr (see ParTauDETR_module.configure_optimizers). This is
    # the peak, reached at pct_start * total_steps; the schedule starts at
    # lr/25 and anneals to ~0 afterwards. At 1e-3 the 2026-09-20 run was healthy
    # all the way up to ~8e-4 (step 40k) and the gradient norm only began its
    # runaway above ~9.9e-4, going 2.6 -> 26 -> 2582 -> 1.3e5 -> inf over 2500
    # steps. 3e-4 keeps a 3.3x margin under the observed failure point; 5e-4 is
    # the aggressive end of what that run supports.
    lr: 0.0003
    model:
        name: MultiParTau # MultiParTau | SingleParTau
        backbone: ParT # ParT | Mixer (SingleParTau only; the Mixer wants dataset.sort_by_pt)
        task: is_tau # SingleParTau only: is_tau | charge | decay_mode | kinematics
        # ParT encoder architecture. Set explicitly: the modules fall back to
        # their own defaults when a key is missing (num_layers defaults to 8),
        # so an absent key is a silent architecture change, not "the usual".
        num_layers: 2
        num_heads: 8
        num_cls_layers: 2
        embed_dims: [256, 512, 256]
        pair_embed_dims: [64, 64, 64]
        # MLP-Mixer width, used only when backbone is Mixer.
        embed_dim: 128
    # Seeds model init, dropout and shuffling. dataset.selection_seed picks
    # WHICH jets are used; this one picks how they are trained on. A scaling
    # study wants both varied together per repeat.
    seed: 42

    trainer:
        max_epochs: 250
        # Fixed optimizer-step budget. null -> bounded by max_epochs only.
        # Set this for scaling studies: with max_epochs fixed instead, a 1e5-jet
        # run gets ~2k updates and a 1e7-jet run ~200k, so the curve measures
        # compute rather than data. When set, max_epochs is forced to -1 so the
        # step budget is the only limit, and OneCycleLR anneals over exactly
        # this many steps (estimated_stepping_batches caps at max_steps).
        max_steps: null
        # "gpu" fails loudly if no CUDA device is visible. "auto" silently falls
        # back to CPU, which looks like a working-but-inexplicably-slow run.
        accelerator: gpu
        devices: 1
        # bf16-mixed: no GradScaler, so the failure mode of the 250-epoch run of
        # 2026-09-16 -- the fp16 loss scale collapsing to a subnormal around
        # epoch 100, gradients underflowing to zero, weights going NaN at epoch
        # 169 -- cannot recur. Native on Ada (L40S) and MI250X; measured cost 5%
        # of throughput (1.79 -> 1.68 it/s). 16-mixed remains selectable.
        precision: bf16-mixed
        # Global-norm gradient clipping. At 1.0 this bound on essentially every
        # step of the healthy phase (grad/clipped ~ 1.0 for 75 epochs, 94% of
        # steps over the measured window), so it was the step-size controller
        # rather than a safety net, and it deleted the gradient magnitude that
        # is the only signal curvature is rising. Healthy norms on the
        # 2026-09-20 run, measured over steps 150-55 000, were p50 2.8, p95 7.5,
        # p99 10.0, max 13.4, so 5.0 sits above the bulk: it leaves ~83% of
        # healthy steps untouched and actually means something when it fires.
        # (An earlier version of this comment quoted max 37.9. That number is
        # the START-UP transient -- the first logged step of the run -- not the
        # healthy maximum, and taking it for one is what mis-set grad_skip_norm
        # below.) Clipping is also what absorbs that start-up transient, which
        # is why grad_skip_warmup_steps hands the first steps to it.
        # Raise this only together with a lower
        # training.lr -- note that with AdamW a constant rescale of every
        # gradient cancels out of the update, so this is not itself an LR knob.
        # optimizer.grad_skip_norm, not this, is the guard against a runaway.
        gradient_clip_val: 5.0

        # Validation loss above which EarlyStopping calls the run diverged (see
        # train_ParTauDETR.callbacks). check_finite alone missed the 2026-09-20
        # blow-up because the loss rose to 7.67 without ever going non-finite.
        # A healthy plateau is ~0.73. null disables the check.
        val_loss_divergence_threshold: 3.0

        # Validation runs at epoch end by default. With a multi-hour epoch that
        # means no val_losses/* metrics and no ModelCheckpoint(monitor=
        # "val_losses/loss") for hours. Validate every N training steps instead.
        # null -> validate once at the end of each training epoch, on the
        # full validation split. This relies on ParticleTransformerDETRDataset
        # returning an EXACT __len__; an over-estimate makes Lightning skip
        # end-of-epoch validation silently.
        val_check_interval: null
        # null -> use every validation batch.
        limit_val_batches: null
        # A couple of sanity batches before training surfaces a broken val path
        # in seconds rather than after the first epoch.
        num_sanity_val_steps: 2

    task_weights:
        tau_id: 1.0
        charge: 1.0
        decay_mode: 1.0
        kinematics: 2.0 # higher weight → larger gradient magnitude

    task_weight_scheduler:
        enabled: true
        monitor_tasks: ["charge", "decay_mode"]
        patience: 3
        factor: 0.5
        min_weight: 0.05

    optimizer:
        # AdamW weight decay, applied to weight matrices only. Biases, LayerNorm
        # gains, the DETR query embeddings and the cls token are excluded (the
        # models' no_weight_decay() sets, previously defined but never used).
        weight_decay: 0.01
        # OneCycleLR cycles AdamW's beta1 0.95 -> 0.85 -> 0.95 by default; that
        # was never asked for, and beta1 sat at its minimum exactly where the
        # 250-epoch run blew up. Off unless deliberately studied.
        cycle_momentum: false
        # Fraction of total_steps OneCycleLR spends ramping up to lr. It sets
        # WHERE the peak lands, not how high it is and not how long the schedule
        # lingers near it (the ramp shortening is cancelled by the decay
        # lengthening). The default 0.3 put the peak at step 55 425 of 184 750,
        # so the highest LR of the run coincided with its sharpest model, which
        # is where it diverged; 0.1 moves the peak to step 18 475, while the
        # model is still under-trained, and leaves 90% of the run annealing.
        pct_start: 0.1
        # Gradient-norm outlier guard (ParTauDETR_module.on_before_optimizer_step).
        # A step whose pre-clip global norm exceeds this, or is non-finite, has
        # its gradient zeroed and is skipped rather than clipped and applied --
        # clipping keeps the direction of a garbage gradient and only discards
        # its magnitude. Healthy norms over steps 150-55 000 of the 2026-09-20
        # run were p50 2.8, p99 10.0, max 13.4, and the divergence went
        # 2.6 -> 26 -> 2582 -> 1.3e5 -> inf, so 50.0 separates the two cleanly.
        # grad_skip_patience consecutive skips abort the run: at that point it
        # is not an outlier batch, it has diverged. Set grad_skip_norm to 0 to
        # disable the skip and keep only the logging.
        grad_skip_norm: 50.0
        grad_skip_patience: 50
        # Steps at the start of training during which a LARGE BUT FINITE norm
        # does not skip and does not count towards grad_skip_patience; a
        # non-finite one still does, at any step, because that is never
        # legitimate. Needed because the guard's threshold describes trained
        # weights, not fresh ones: at initialisation the norm is ~270, and it
        # is gradient_clip_val, not the guard, that is supposed to absorb that.
        # Without this grace the guard is a deadlock -- it zeroes the gradient
        # from step 0, so the weights never move, so the norm never falls, so
        # every step skips. Run 61024711 (2026-09-21) died exactly that way:
        # 51 consecutive skips, aborted at step 51 of epoch 0 with the LR still
        # at its 1.2e-5 starting value, without ever applying one real update.
        # The 2026-09-20 run, which had clipping only, was already down to 6.4
        # by step 149, so 500 is a wide margin; the loss-side checks
        # (training_step's non-finite counter, EarlyStopping) still cover the
        # window. 0 disables the grace and arms the guard from step 0.
        grad_skip_warmup_steps: 500
        # Exact per-loss gradient norms and pairwise cosine similarities require
        # one extra autograd traversal and one retained gradient copy per enabled
        # loss. Sample them sparsely; 0 disables these diagnostics. The cheap
        # combined grad/total_norm remains logged every optimizer step.
        per_loss_gradient_log_every_n_steps: 100

    dataloader:
        batch_size: 12288
        # Keep this a couple below #SBATCH --cpus-per-task in train-gpu-DETR.sh:
        # the main process also needs cores for the CPU-side Hungarian matching
        # and the pin_memory thread. Clamped automatically to the real cpuset.
        # The run is GPU-bound, so this only needs to cover the ~6-core bursts
        # when workers build chunks concurrently. Note each worker holds
        # mixing_reads chunks, so raising this raises host RAM linearly.
        num_dataloader_workers: 6
        prefetch_factor: 10

        # Keep one pyarrow handle per file per worker so the Parquet footer is
        # parsed once instead of on every read. With ~34k row groups per file
        # that is the difference between seconds and ~90 s per read.
        cache_parquet_handles: true

        # Consecutive row groups coalesced into a single read. Amortises the
        # per-read fixed cost; 100 x 1024 ~= 100k jets per read. Set to 1 once
        # the input files are repacked to ~100k-row row groups, otherwise a read
        # becomes millions of jets and the worker runs out of memory.
        row_groups_per_read: 100

        # Reads held in memory at once, now split evenly across the samples:
        # each sample keeps mixing_reads / n_samples reads buffered and every
        # batch draws from all of them, so class mixing is guaranteed rather
        # than left to which reads happened to land together. This value is
        # therefore only a memory/diversity knob; it no longer decides whether a
        # batch sees both classes. Costs proportionally more worker RAM.
        mixing_reads: 4

    # Objectness threshold calibration. The value in
    # model.detr.inference.score_threshold is the starting point and the
    # fallback; before every validation it is rescanned for the best mean
    # per-jet F1 of matched daughters, the same figure of merit the inference
    # notebook scans. Done on recent TRAIN batches, buffered during training so
    # it costs no extra forward passes -- and on train rather than validation,
    # because choosing the operating point on the split you then report would
    # flatter every number downstream of it.
    threshold_scan:
        enabled: true
        jets: 100000
        # What the scan maximises. "decay_mode": the fraction of true taus whose
        # predicted charged and neutral daughter counts both match the truth,
        # i.e. decay-mode accuracy -- the deliverable, all-or-nothing in the
        # prong count. "f1": mean per-jet F1 of dR-matched daughters, which
        # treats one spurious or missing daughter as a partial loss; its optimum
        # sits ~0.1 below the decay-mode one and cost ~2 points of accuracy
        # when it was the objective (measured on the 20k-step baseline).
        objective: decay_mode
        # Grid. With eos_coef 1.0 the optimum sits at 0.5, which was the lower
        # edge of the old [0.5, 0.9] grid, so the grid now starts well below.
        low: 0.3
        high: 0.9
        points: 13
        # Only every Nth training step is buffered. The ring holds `jets`
        # jets, ~17 batches at the default batch size, so buffering every step
        # copied six tensors to the host per step (each a device sync) and
        # discarded 97% of them. Every 20th step covers ~340 steps of training
        # with the same memory.
        buffer_every_n_steps: 20

    # Jets kept per validation epoch for the jet-level figures (charge and decay
    # mode confusion matrices, tau kinematics residuals, tagging ROC). Only
    # per-jet scalars are retained, and the distributions converge long before a
    # full multi-million-jet validation split.
    jet_level_eval_jets: 200000

    # Forward-only throughput of the trained model, measured after fit() and
    # written into metrics.json. A scaling study needs it alongside the loss:
    # a bigger model is only worth it per unit of inference cost.
    inference_benchmark:
        enabled: true
        # Batches timed after the warm-up ones. 20 x batch_size jets is plenty
        # for a stable mean and costs seconds.
        batches: 20
        # Discarded: the first forward pays for kernel compilation and allocator
        # warm-up, which would otherwise dominate the mean at this batch count.
        warmup: 3

    input_scaling:
        # Standardise the continuous candidate features to zero mean and unit
        # variance. The scaler is fitted ONCE, on the training split, saved to
        # scaler_path, and reused from there by validation, test and evaluation:
        # a checkpoint is only valid for the constants it was trained with, so
        # refitting per run would silently move its inputs. Delete the .npz to
        # force a refit.
        enabled: false
        scaler_path: ${output_dir}/scaler/cand_feature_scaler.npz
        # Jets read for the fit. A per-feature mean and std converge long before
        # the full split, and this pass costs wall clock before training starts.
        fit_jets: 500000
        # Only the continuous features: 7 is charge and 8-12 are the PID
        # one-hots, which are already 0/1 and must not be shifted.
        continuous_feature_indices: [0, 1, 2, 3, 4, 5, 6, 13, 14, 15, 16]

# Mixer distillation (mltau/scripts/distill.py): representation distillation,
# a low-LR head warm-up, then joint fine-tuning with separate learning rates
# for the student backbone and the task head.
distillation:
    representation_epochs: 20
    head_warmup_epochs: 5
    representation_lr: 0.001
    head_warmup_lr: 0.0001
    joint_head_lr: 0.0003
    joint_backbone_lr: 0.00002
    global_loss_weight: 1.0
    token_loss_weight: 1.0
    masked_token_loss_weight: 1.0
    mask_probability: 0.3
    output_distill_loss_weight: 1.0
    adaptation_feature_loss_weight: 0.1
    enable_input_scaling: true

teacher_checkpoint: null
