dataset:
    max_cands: 20
    num_features: 17
    # Lifetime input features remain [signed dz, dz error, signed dxy, dxy
    # error] by default. Set use_log_significance=true to replace each error
    # with log(abs(IP) / IP_error). A positive transform_scale replaces each
    # signed IP with 2 * arctan(transform_scale * IP) / pi; zero or a negative
    # value leaves it unchanged. For example:
    #   dataset.impact_parameter_features.use_log_significance=true
    #   dataset.impact_parameter_features.transform_scale=30
    impact_parameter_features:
        use_log_significance: false
        transform_scale: 0.0
    # Target slots per jet, and (by interpolation) the number of decoder
    # queries. Measured over all 5.3M signal jets of the 0915 production with
    # check_query_budget.py: after the meson-class filter no tau has more than
    # 5 daughters (DM 4 and DM 12 reach exactly 5), so 6 is one slot of margin,
    # not a requirement. Fewer queries make each one count more; see
    # model.detr.loss.eos_coef before changing this.
    max_tau_daughters: 5
     # Negative value disables the pT cut
     # NB! When enabling the cut, the charge, DM and 4-momentum that is
     # obtained by aggregating generator-level constituents passing the pT
     # cut might differ from the charge, DM and 4-momentum of the visible
     # generator-level tau that's stored in the dataset. The correct solution
     # would be to rederive the target charge, DM and 4-momentum of the visible
     # generator-level tau after the pT cut. Note that this is only an issue if
     # the pT cut is enabled and weight_parent_* weights are positive.
    tau_daughter_pt_cut: -1.0
    data_dir: /scratch/persistent/karl/ml-tau/1002_ParTauDETR_dataset/

    # Meson classes for daughter one-hot encoding. Mapping order defines class
    # indices and charges defines valid charge-head combinations. All unlisted
    # decay products are discarded before target padding/truncation.
    tau_daughter_pdg_ids:
        charged:
            pdg_ids: [211, 321] # pi+/-, K+/-
            charges: [-1, 1]
        neutral:
            pdg_ids: [111, 221, 130] # pi0, eta -> yy, K_L0
            charges: [0]

    # Cap how many jets each sample contributes to train+val. Keys are the
    # filename prefixes before "_train" (e.g. z_train_0003.parquet -> "z").
    # Omit a sample or set it to null to use everything. Selection is
    # deterministic given selection_seed, and the chosen counts are printed at
    # startup, so a run is reproducible from the config alone. Never applied to
    # the test set.
    max_jets_per_sample:
        z: null
        qq: 10_000_000
    selection_seed: 42

    relative_sizes:
        train: 0.7
        val: 0.1
        test: 0.2
